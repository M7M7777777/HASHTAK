name: Validate Python

on:
  push:
    branches: [main, telegram-full-storage-migration]
  pull_request:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile bot
        run: python -m py_compile bot.py
